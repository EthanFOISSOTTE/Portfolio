<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="../Styles/options.css">
	<title>MineFolio-Personnel</title>
</head>
<body>
	<header>
		<br><h2>Personnel/Contact</h2>
	</header>

	<main>
			<div class="container">
				<div class="contact-form">
					<h3>Contactez moi</h3>
					<form id="contact-form">
						<div class="input-group">
							<input type="text" name="Nom" placeholder="Nom" required>
							<input type="email" name="Email" placeholder="Email" required>
						</div>
						<input type="text" name="subject" placeholder="Sujet" required>
						<textarea name="message" placeholder="Message" required></textarea>
						<button type="submit">Envoyer Message</button>
					</form>
				</div>
				<div class="contact-info">
					<h3>Mes informations</h3>
					<p><strong>📍 Adresse:</strong> 11 bis rue Mathieu de Dombasle</p>
					<p><strong>📞 Téléphone:</strong> 06.81.71.96.98</p>
					<p><strong>📧 Email:</strong> ethan.foissotte@epitech.eu</p>
					<p><strong>🌐 LinkedIn:</strong> https://linkedin.com/in/ethan-foissotte-a823552bb</p>
				</div>
			</div>
		<a href="../index.html"><button class="Menu">Menu</button></a>
	</main>

	<script type="text/javascript"
			src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
	</script>

	<script type="text/javascript">
		(function(){
			emailjs.init({
				publicKey: "Hct3evHfHy0P5DEM0", // Remplace avec ta clé publique EmailJS
			});
		})();

		document.getElementById("contact-form").addEventListener("submit", function(event) {
			event.preventDefault(); // Empêche le rechargement de la page

			emailjs.sendForm("service_6m9nfva", "template_n6kb9xz", this)
					.then(function() {
						alert("Message envoyé avec succès !");
					}, function(error) {
						alert("Erreur lors de l'envoi : " + JSON.stringify(error));
					});
		});
	</script>
</body>
</html>
