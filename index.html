<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" type="text/css" href="Styles/index.css">
	<title>MineFolio</title>
</head>

<body>
<!-- En-tête -->
<header>
	<img class="Name" src="Images/MINEFOLIO.png">
	<h5>Recherche Alternance</h5>
</header>

<!-- Boutons avec sons -->
<button id="minecraft-btn1" onclick="audio.play(); setTimeout(() => { location.href='Pages/singleplayer.html'; }, 100);">Compétences</button>
<button id="minecraft-btn2" onclick="audio.play(); setTimeout(() => { location.href='Pages/multiplayer.html'; }, 100);">Expériences</button>
<button id="minecraft-btn3" onclick="audio.play(); setTimeout(() => { location.href='Pages/advancementplayer.html'; }, 100);">Formations</button>
<button class="Options" onclick="audio.play(); setTimeout(() => {location.href='Pages/options.html'; }, 100);">Personnel</button>
<button class="Quitter" id="quit-btn" onclick="audio.play()">Quitter</button>

<footer>
	<p class="Version">MineFolio v.1.1</p>
	<p class="Copyright">Copyright FOISSOTTE E. Do not distribute!</p>
</footer>

<script type="text/javascript">
	// Permet de fermer la fenêtre quand on appuie sur le bouton "Quitter".
	document.getElementById('quit-btn').addEventListener('click', function () {
		const userConfirmed = window.confirm('Voulez-vous vraiment quitter la page ? Vous serez redirigé vers Google.');
		if (userConfirmed) {
			window.close();
			if (!window.closed) {
				window.location.href = 'https://www.google.com';
			}
		}
	});

	// Lecture du son lors d'un clic sur un bouton
	var audio = new Audio();
	audio.src = "Son/minecraft_click.mp3";
</script>
</body>
</html>
