<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" type="text/css" href="Styles/index.css">
	<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
	<title>MineFolio</title>
</head>
<body>

<!-- En-tête -->
<header>
	<img class="Name" src="Images/MINEFOLIO.png">
	<h5>Recherche Alternance</h5>
</header>

<!-- Boutons avec sons -->
<button id="minecraft-btn1" onclick="playClickSound(); setTimeout(() => { location.href='Pages/Competences.html'; }, 100);">Compétences</button>
<button id="minecraft-btn2" onclick="playClickSound(); setTimeout(() => { location.href='Pages/multiplayer.html'; }, 100);">Expériences</button>
<button id="minecraft-btn3" onclick="playClickSound(); setTimeout(() => { location.href='Pages/advancementplayer.html'; }, 100);">Formations</button>
<div class="btn-container">
	<button id="Options" onclick="playClickSound(); setTimeout(() => { location.href='Pages/options.html'; }, 100);">Personnel</button>
	<button id="Quitter" id="quit-btn">Quitter</button>
</div>


<div id="dialogueBox" class="dialogue-box">
	Salut, bienvenue sur mon portfolio !
</div>

<div class="skin-container" id="skinClick">
	<div class="player-name">FOISSOTTE Ethan</div>
	<img src="../Images/Skin.png" alt="Skin Minecraft">
</div>


<a-scene>
	<a-sky
			src="https://i.ibb.co/Kz9sjPNg/untitled.png"
			rotation="0 90 0"
			animation="property: rotation; to: 0 270 0; loop: true; dur: 60000; easing: linear;">
	</a-sky>
</a-scene>

<!-- Bouton pour démarrer le son d'ambiance || Non fonctionnel à 100% -->
<!--<button id="start-sound" onclick="startSound()">Démarrer le son</button>-->

<!-- Iframe cachée pour le son d'ambiance || Non fonctionnel à 100%-->
<!--<iframe id="sound-frame" src="sound.html" style="display: none;"></iframe>-->

<footer>
	<p class="Version">
		<a href="https://github.com/EthanFOISSOTTE/Portfolio" target="_blank" class="link-style">MineFolio v.1.5.0</a>
	</p>
	<!--<p class="Copyright">Copyright FOISSOTTE E. Do not distribute!</p>-->
</footer>

<script>
	// Fonction pour jouer le son de clic
	const clickSound = new Audio("Son/minecraft_click.mp3");

	function playClickSound() {
		clickSound.currentTime = 0;
		clickSound.play();
	}

	// Fonction pour démarrer le son d'ambiance
	function startSound() {
		// Accéder à l'iframe
		const iframe = document.getElementById('sound-frame');

		// Vérifier si l'iframe et l'élément audio sont chargés
		if (iframe && iframe.contentWindow) {
			const sound = iframe.contentWindow.document.getElementById('background-sound');

			// S'assurer que l'élément audio existe avant d'essayer de manipuler ses propriétés
			if (sound) {
				sound.volume = 0.5; // Ajustez le volume comme souhaité
				sound.play().catch((e) => {
					console.warn("Le son d'ambiance a été bloqué.");
				});
			} else {
				console.error('Le son n\'est pas trouvé dans l\'iframe.');
			}
		} else {
			console.error('Iframe ou contenu de l\'iframe non disponible.');
		}
	}
</script>

<script>
	// Gestion du clic sur l'assistant
	const dialogueBox = document.getElementById("dialogueBox");
	const skinClick = document.getElementById("skinClick");

	skinClick.addEventListener("click", () => {
		dialogueBox.style.display = "block";
		dialogueBox.style.opacity = "1";

		setTimeout(() => {
			dialogueBox.style.opacity = "0";
			setTimeout(() => dialogueBox.style.display = "none", 500);
		}, 3000);
	});
</script>

</body>
</html>
